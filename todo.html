<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do App</title>
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8f55a;
      --text: #e8e8e8;
      --muted: #666;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 40px;
      letter-spacing: 0.1em;
    }

    #task-count {
      font-size: 1rem;
      color: var(--muted);
    }

    .input-area {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
    }

    #task-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
    }
    #task-input:focus { border-color: var(--accent); }

    #add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #add-btn:hover { opacity: 0.8; }

    .filter-area {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 16px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    #task-list {
      list-style: none;
      width: 100%;
      max-width: 500px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 2px;
    }

    .task-item input[type="checkbox"] { cursor: pointer; }

    .task-text {
      flex: 1;
      font-size: 0.9rem;
    }
    .task-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .delete-btn:hover { border-color: #ff5f57; color: #ff5f57; }

    #clear-btn {
      margin-top: 20px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 20px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #clear-btn:hover { border-color: #ff5f57; color: #ff5f57; }
  </style>

</head>
<body>

  <h1>To Do リスト <span id="task-count"></span></h1>

  <div class="input-area">
    <input type="text" id="task-input" placeholder="タスクを入力...">
    <button id="add-btn">追加</button>
  </div>

  <div class="filter-area">
    <button class="filter-btn active" data-filter="all">全て</button>
    <button class="filter-btn" data-filter="active">未完了</button>
    <button class="filter-btn" data-filter="done">完了済み</button>
  </div>

  <ul id="task-list"></ul>

  <button id="clear-btn">完了済みを削除</button>

    <script>
    const input    = document.getElementById('task-input');
    const addBtn   = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const clearBtn = document.getElementById('clear-btn');
    const taskCount = document.getElementById('task-count');

    let tasks = [];
    let currentFilter = 'all';

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTask();
    });

    function addTask() {
      const text = input.value.trim();
      if (text === '') return;

      tasks.push({ text: text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    function render() {
      taskList.innerHTML = '';

      const filtered = tasks.filter(function(task) {
        if (currentFilter === 'active') return !task.done;
        if (currentFilter === 'done')   return task.done;
        return true;
      });

      filtered.forEach(function(task, index) {
        const realIndex = tasks.indexOf(task);

        const li = document.createElement('li');
        li.className = 'task-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', function() {
          tasks[realIndex].done = checkbox.checked;
          render();
        });

        const span = document.createElement('span');
        span.className = 'task-text' + (task.done ? ' done' : '');
        span.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', function() {
          tasks.splice(realIndex, 1);
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });

      const remaining = tasks.filter(function(t) { return !t.done; }).length;
      taskCount.textContent = '(' + remaining + ' 件)';
    }

    clearBtn.addEventListener('click', function() {
      tasks = tasks.filter(function(t) { return !t.done; });
      render();
    });

    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentFilter = btn.dataset.filter;
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
    });

    render();
  </script>

</body>
</html>
